name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Ecommerce Backend
        run: |
          cd /opt/ecommerce/source/Ecommerce

          git fetch origin
          git reset --hard origin/main

          docker build -t ecommerce-backend:test .

          cd /opt/ecommerce/deploy

          docker compose up -d --force-recreate backend

          docker image prune -f

          echo "Waiting for backend to become ready..."

          for i in {1..12}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo "Backend is healthy."
              exit 0
            fi

            echo "Backend not ready yet. Waiting 5 seconds..."
            sleep 5
          done

          echo "Backend failed health check."
          docker logs --tail 100 ecommerce-backend
          exit 1